[workspace]
members = [".", "crates/hephaestus", "crates/dbiso"]
# hephaestus-driver is a kernel-mode `.sys` built with the WDK on its own; a
# workspace cannot mix it with the user-mode staticlib/cdylib Tauri links, so it
# is excluded and built separately. See crates/hephaestus-driver/README.md.
exclude = ["crates/hephaestus-driver"]
resolver = "2"

[package]
name = "tempest"
version = "0.1.18"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tempest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hephaestus = { path = "crates/hephaestus" }
dbiso = { path = "crates/dbiso" }
tauri = { version = "2", features = ["protocol-asset", "unstable", "devtools"] }
url = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
dashmap = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
# Verifies the signed remote agents manifest (config/agents.json). Already in the
# tree via tauri-plugin-updater; named here so the verify command can use it.
minisign-verify = "0.2"
# Loopback HTTP receiver for agent lifecycle hooks (agent_hooks.rs). A small,
# correct HTTP impl beats hand-rolling request parsing over raw TCP.
tiny_http = "0.12"
# OS entropy for the per-run hook-server auth token.
getrandom = "0.2"
# UUID generation for automation IDs
uuid = { version = "1", features = ["v4"] }
# Blocking HTTP for the automations "Try it" tool preview — small, sync, no
# runtime pulled in. Only reached from the try_http_request Tauri command.
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
# Experimental: Jin Lee's Rust AI gateway, wired as an opt-in chat backend on
# canvas chat nodes. Gated behind the "experimental features" setting; if the
# feature is off, warp_bridge is never invoked and this dep sits idle.
warpllm = "0.2"
# OS credential manager for BYOK API keys (Windows Credential Manager, macOS
# Keychain, Linux Secret Service). Replaces plaintext localStorage.
keyring = "2"
# warpllm ships no runtime — chat_completions is async, so we need a full
# tokio to drive it from the Tauri command.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
junction = "1"

[profile.dev]
debug = "line-tables-only"  # smaller debuginfo -> much faster linking on Windows

[profile.release]
opt-level     = "z"     # optimize for size, not speed
lto           = "thin"  # cross-crate dead-code elimination
codegen-units = 1       # single unit lets LLVM optimize across more code
strip         = true    # strip debug symbols
panic         = "abort" # removes unwinding machinery (~200 KB)

