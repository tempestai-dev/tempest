name: CI

on:
  push:
    branches: [main, feat-atlas]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Remove non-app workspaces
        run: |
          node -e "const fs=require('fs'),p=JSON.parse(fs.readFileSync('package.json','utf8'));p.workspaces=p.workspaces.filter(w=>w!=='web'&&w!=='docs');fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
          rm -rf web docs
          npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build:frontend

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
        with:
          workspaces: src-tauri -> src-tauri/target

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev

      - name: Stub atlas bundle for cargo check
        run: mkdir -p src-tauri/resources/atlas && touch src-tauri/resources/atlas/.keep

      - name: Check
        working-directory: src-tauri
        run: cargo check

      - name: Test
        working-directory: src-tauri
        run: cargo test

  macos-atlas-probe:
    name: macOS Atlas spawn probe
    runs-on: macos-latest
    steps:
      # macOS GUI apps launched via LaunchServices / Finder inherit a minimal
      # PATH — no /opt/homebrew/bin, no /usr/local/bin, no nvm/volta/fnm shims.
      # That's why `Command::new("node").spawn()` in start_atlas_index fails
      # with `os error 2` even though `node` works fine from the user's shell
      # (issue #36). Reproduce that PATH here so every CI run tells us where
      # node actually lives on macOS runners and which resolution strategies
      # succeed under restricted PATH. Extend to a full .app smoke once the
      # fix approach is picked.
      - name: Show Finder-launched PATH and probe node
        shell: bash
        run: |
          set +e
          echo "=== host PATH (for reference) ==="
          echo "$PATH"
          echo "=== host node ==="
          command -v node && node --version

          echo
          echo "=== simulating Finder-launched restricted PATH ==="
          env -i HOME="$HOME" PATH=/usr/bin:/bin:/usr/sbin:/sbin bash -c '
            echo "PATH=$PATH"
            echo "--- direct lookup ---"
            command -v node && node --version || echo "node NOT on restricted PATH"
            echo "--- common install locations ---"
            for p in \
              /opt/homebrew/bin/node \
              /usr/local/bin/node \
              "$HOME/.volta/bin/node" \
              "$HOME/.nvm/versions/node"; do
              if [ -e "$p" ]; then echo "  FOUND: $p"; else echo "  missing: $p"; fi
            done
            echo "--- login shell resolution ---"
            /bin/sh -lc "command -v node && node --version" \
              || echo "login shell resolution FAILED"
            echo "--- /usr/libexec/path_helper ---"
            eval "$(/usr/libexec/path_helper -s)" && echo "PATH after path_helper: $PATH"
            command -v node || echo "still no node after path_helper"
          '
