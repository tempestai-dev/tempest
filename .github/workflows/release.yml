name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release (if no draft exists)
        run: |
          if gh release view ${{ github.ref_name }} --repo tempestai-dev/tempest > /dev/null 2>&1; then
            echo "Release already exists, keeping existing notes and state."
          else
            gh release create ${{ github.ref_name }} \
              --draft \
              --title "${{ github.ref_name }}" \
              --notes "" \
              --repo tempestai-dev/tempest
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust-target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            bundles: dmg,app
            bundle-dir: src-tauri/target/aarch64-apple-darwin/release/bundle

          - os: macos-latest
            rust-target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            bundles: dmg,app
            bundle-dir: src-tauri/target/x86_64-apple-darwin/release/bundle

          - os: ubuntu-22.04
            rust-target: ""
            args: ""
            bundles: appimage,deb
            bundle-dir: src-tauri/target/release/bundle

          - os: ubuntu-24.04-arm
            rust-target: ""
            args: ""
            bundles: appimage,deb
            bundle-dir: src-tauri/target/release/bundle

          - os: windows-latest
            rust-target: ""
            args: ""
            bundles: nsis,msi
            bundle-dir: src-tauri/target/release/bundle

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
        with:
          workspaces: src-tauri -> src-tauri/target
          key: ${{ matrix.os }}-${{ matrix.rust-target }}

      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            xdg-utils
          # linuxdeploy is an AppImage; needs FUSE to execute.
          # 22.04 = libfuse2, 24.04 = libfuse2t64.
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

          echo "=== [DEBUG] system info ==="
          uname -a
          . /etc/os-release && echo "$PRETTY_NAME"
          echo "=== [DEBUG] fuse status ==="
          ls -l /dev/fuse || echo "[DEBUG] /dev/fuse MISSING"
          fusermount --version 2>&1 || true
          fusermount3 --version 2>&1 || true
          dpkg -l | grep -i fuse || echo "[DEBUG] no fuse packages found"
          echo "=== [DEBUG] key libs ==="
          dpkg -l | grep -Ei 'webkit2gtk|appindicator|rsvg|patchelf|xdo' | awk '{print $2, $3}'

      - name: Enable long paths (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1
          git config --global core.longpaths true

      - run: npm ci

      # Notarization rejects any unsigned nested Mach-O (e.g. onnxruntime-node
      # dylibs/.node files that atlas ships as bundled resources). Pre-sign
      # them with the same Developer ID + secure timestamp Tauri uses on the
      # outer .app.
      - name: Pre-sign nested macOS Mach-O binaries
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/presign.keychain-db"
          CERT_PATH="$RUNNER_TEMP/apple-cert.p12"

          echo -n "$APPLE_CERTIFICATE" | base64 --decode --output "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | tr -d '"')
          rm -f "$CERT_PATH"

          find src-tauri/resources -type f \( -name "*.dylib" -o -name "*.node" -o -name "*.so" \) -print0 |
            while IFS= read -r -d '' f; do
              if file "$f" | grep -q "Mach-O"; then
                echo "signing: $f"
                codesign --force --timestamp --options=runtime \
                  --sign "$APPLE_SIGNING_IDENTITY" "$f"
              fi
            done

      # Tauri swallows linuxdeploy's output on failure ("failed to run
      # linuxdeploy" with no detail). Probe the exact binary Tauri will use,
      # directly, so its real stdout/stderr lands in this job's log.
      - name: Debug probe linuxdeploy AppImage
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) LD_ARCH=x86_64 ;;
            aarch64) LD_ARCH=aarch64 ;;
            *) LD_ARCH="$ARCH" ;;
          esac
          echo "=== [DEBUG] downloading linuxdeploy-${LD_ARCH}.AppImage (same URL tauri uses) ==="
          curl -fsSL -o /tmp/linuxdeploy.AppImage \
            "https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy/linuxdeploy-${LD_ARCH}.AppImage"
          chmod +x /tmp/linuxdeploy.AppImage
          echo "=== [DEBUG] probe 1: plain run (FUSE path) ==="
          unset APPIMAGE_EXTRACT_AND_RUN || true
          /tmp/linuxdeploy.AppImage --version || echo "[DEBUG] probe 1 FAILED exit=$?"
          echo "=== [DEBUG] probe 2: APPIMAGE_EXTRACT_AND_RUN=1 ==="
          APPIMAGE_EXTRACT_AND_RUN=1 /tmp/linuxdeploy.AppImage --version || echo "[DEBUG] probe 2 FAILED exit=$?"
          echo "=== [DEBUG] probes done ==="

      # The bundled bridge/atlas resources contain native Linux binaries that
      # are dynamically linked against musl libc (Bun-built sidecars etc.).
      # Ubuntu runners have no musl, so linuxdeploy aborts with
      # "Could not find dependency: libc.musl-x86_64.so.1". Find every
      # offending file, then install a thin wrapper where Tauri caches
      # linuxdeploy that appends --exclude-file patterns, so those files are
      # skipped during dependency resolution. They remain in the image,
      # exactly like in the .deb bundle (which never resolves deps).
      - name: Exclude musl-linked binaries from linuxdeploy
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          set -euo pipefail
          echo "=== [DEBUG] scanning resources for musl-linked ELFs ==="
          HITS=$(grep -rlaE 'ld-musl|libc\.musl-[a-z0-9_]+' src-tauri/resources || true)
          if [ -z "$HITS" ]; then
            echo "[DEBUG] no musl-linked files found; nothing to exclude"
            exit 0
          fi
          PATTERNS=""
          while IFS= read -r f; do
            echo "[DEBUG] musl-linked file: $f"
            base=$(basename "$f")
            PATTERNS="$PATTERNS --exclude-file *$base --exclude-file $base"
          done <<< "$HITS"
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) LD_ARCH=x86_64 ;;
            aarch64) LD_ARCH=aarch64 ;;
            *) LD_ARCH="$ARCH" ;;
          esac
          CACHE="$HOME/.cache/tauri"
          mkdir -p "$CACHE"
          WRAPPER="$CACHE/linuxdeploy-${LD_ARCH}.AppImage"
          rm -f "$WRAPPER"
          curl -fsSL -o "/tmp/linuxdeploy-real-${LD_ARCH}.AppImage" \
            "https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy/linuxdeploy-${LD_ARCH}.AppImage"
          chmod +x "/tmp/linuxdeploy-real-${LD_ARCH}.AppImage"
          {
            echo '#!/usr/bin/env bash'
            echo "exec /tmp/linuxdeploy-real-${LD_ARCH}.AppImage \"\$@\"$PATTERNS"
          } > "$WRAPPER"
          chmod +x "$WRAPPER"
          echo "=== [DEBUG] linuxdeploy wrapper installed at $WRAPPER ==="
          cat "$WRAPPER"

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          case "${{ matrix.os }}" in
            ubuntu*)
              echo "=== [DEBUG] starting tauri build on ${{ matrix.os }} ($(uname -m)) ==="
              echo "=== [DEBUG] APPIMAGE_EXTRACT_AND_RUN=$APPIMAGE_EXTRACT_AND_RUN ==="
              npx tauri build --verbose --bundles ${{ matrix.bundles }} ${{ matrix.args }} 2>&1 | tee build-output.log
              ;;
            *)
              npx tauri build --bundles ${{ matrix.bundles }} ${{ matrix.args }}
              ;;
          esac
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_POSTHOG_KEY: phc_meJDnwWJ6c5uFsecABnA8ydF4HBL7sykn4GUTWvMV6qL
          # linuxdeploy is an AppImage. GitHub-hosted ARM runners cannot mount
          # FUSE filesystems, so force AppImages to extract themselves and run
          # from a temp directory. This is required on ubuntu-24.04-arm even
          # when libfuse2/libfuse2t64 is installed.
          APPIMAGE_EXTRACT_AND_RUN: 1
          # linuxdeploy's strip binary crashes on ELFs with .relr.dyn
          # sections ("unknown type [0x13]"), aborting AppImage bundling.
          # Skip stripping during bundling; see tauri-apps/tauri#14796.
          NO_STRIP: 1
          # macOS code signing + notarization (Tauri reads these directly)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

      # Runs only when the build fails: dumps the tail of the captured log
      # plus whatever partial state exists in the bundle directories.
      - name: Dump build diagnostics (Linux)
        if: failure() && startsWith(matrix.os, 'ubuntu')
        run: |
          echo "=== [DEBUG] tail of build-output.log ==="
          tail -n 120 build-output.log || true
          echo "=== [DEBUG] bundle dir ==="
          find src-tauri/target/release/bundle -maxdepth 3 -print || true

      # Strip bundled libwayland-* libs from the AppImage so it loads host copies
      # at runtime. Ubuntu 22.04 ships libwayland 1.20; recent Mesa (Fedora 43,
      # Arch, Bazzite, Mesa 1.22+) needs newer symbols. The bundled stale copy
      # wins on the search path and causes EGL_BAD_PARAMETER. These libs are on
      # the AppImage excludelist for this exact reason.
      - name: Fix AppImage wayland libs and re-sign
        if: matrix.os == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          APPIMAGE=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          BASENAME=$(basename "$APPIMAGE")
          echo "Patching: $APPIMAGE"

          WORK=$(mktemp -d)
          cp "$APPIMAGE" "$WORK/"
          pushd "$WORK" >/dev/null
          chmod +x "./$BASENAME"
          "./$BASENAME" --appimage-extract >/dev/null

          for lib in libwayland-client.so.0 libwayland-egl.so.1 libwayland-cursor.so.0; do
            test -e "squashfs-root/usr/lib/$lib" \
              || { echo "expected bundled lib missing: $lib (layout changed?)"; exit 1; }
          done

          rm -f squashfs-root/usr/lib/libwayland-client.so.0 \
                squashfs-root/usr/lib/libwayland-egl.so.1 \
                squashfs-root/usr/lib/libwayland-cursor.so.0 \
                squashfs-root/usr/lib/libwayland-server.so.0

          curl -fsSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run squashfs-root "$BASENAME"

          rm -rf squashfs-root
          chmod +x "./$BASENAME"
          "./$BASENAME" --appimage-extract >/dev/null
          for lib in libwayland-client.so.0 libwayland-egl.so.1 libwayland-cursor.so.0; do
            test ! -e "squashfs-root/usr/lib/$lib" \
              || { echo "lib still present after repack: $lib"; exit 1; }
          done
          test -x squashfs-root/usr/bin/tempest \
            || { echo "tempest binary missing from repacked AppImage"; exit 1; }
          popd >/dev/null

          cp "$WORK/$BASENAME" "$APPIMAGE"
          rm -f "$APPIMAGE.sig"
          npx tauri signer sign "$APPIMAGE"

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          shopt -s nullglob
          files=(
            "src-tauri/target/release/tempest.exe"
            ${{ matrix.bundle-dir }}/nsis/*.exe
            ${{ matrix.bundle-dir }}/nsis/*.exe.sig
            ${{ matrix.bundle-dir }}/msi/*.msi
            ${{ matrix.bundle-dir }}/msi/*.msi.sig
          )
          gh release upload ${{ github.ref_name }} "${files[@]}" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          shopt -s nullglob
          files=(
            ${{ matrix.bundle-dir }}/deb/*.deb
            ${{ matrix.bundle-dir }}/appimage/*.AppImage
            ${{ matrix.bundle-dir }}/appimage/*.AppImage.sig
          )
          gh release upload ${{ github.ref_name }} "${files[@]}" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifacts
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          VERSION="${GITHUB_REF_NAME#v}"
          case "${{ matrix.rust-target }}" in
            aarch64-apple-darwin) ARCH=aarch64 ;;
            x86_64-apple-darwin)  ARCH=x64 ;;
          esac
          # Signed builds produce Tempest.app.tar.gz with no arch suffix, so
          # both matrix jobs would clobber each other on upload. Rename with
          # arch suffix so both archs coexist and match latest.json's expected
          # *_aarch64.app.tar.gz.sig / *_x64.app.tar.gz.sig patterns.
          MACOS_DIR="${{ matrix.bundle-dir }}/macos"
          if [ -f "$MACOS_DIR/Tempest.app.tar.gz" ]; then
            mv "$MACOS_DIR/Tempest.app.tar.gz" \
               "$MACOS_DIR/Tempest_${VERSION}_${ARCH}.app.tar.gz"
            mv "$MACOS_DIR/Tempest.app.tar.gz.sig" \
               "$MACOS_DIR/Tempest_${VERSION}_${ARCH}.app.tar.gz.sig"
          fi
          files=(
            ${{ matrix.bundle-dir }}/dmg/*.dmg
            ${{ matrix.bundle-dir }}/macos/*.app.tar.gz
            ${{ matrix.bundle-dir }}/macos/*.app.tar.gz.sig
          )
          gh release upload ${{ github.ref_name }} "${files[@]}" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signatures
        run: |
          gh release download ${{ github.ref_name }} \
            --pattern "*.sig" \
            --dir sigs \
            --repo tempestai-dev/tempest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 << 'PYEOF'
          import json, os, glob, datetime, subprocess

          tag = os.environ["TAG"]
          version = tag.lstrip("v")
          base_url = f"https://github.com/tempestai-dev/tempest/releases/download/{tag}"

          def read_sig(pattern):
              files = glob.glob(f"sigs/{pattern}")
              if not files:
                  return None, None
              return open(files[0]).read().strip(), os.path.basename(files[0])[:-4]

          platforms = {}

          sig, asset = read_sig(f"*{version}*x64-setup.exe.sig")
          if sig:
              platforms["windows-x86_64"] = {"signature": sig, "url": f"{base_url}/{asset}"}

          sig, asset = read_sig(f"*{version}*amd64.AppImage.sig")
          if sig:
              platforms["linux-x86_64"] = {"signature": sig, "url": f"{base_url}/{asset}"}

          sig, asset = read_sig(f"*{version}*aarch64.AppImage.sig")
          if sig:
              platforms["linux-aarch64"] = {"signature": sig, "url": f"{base_url}/{asset}"}

          sig, asset = read_sig(f"*_aarch64.app.tar.gz.sig")
          if sig:
              platforms["darwin-aarch64"] = {"signature": sig, "url": f"{base_url}/{asset}"}

          sig, asset = read_sig(f"*_x64.app.tar.gz.sig")
          if sig:
              platforms["darwin-x86_64"] = {"signature": sig, "url": f"{base_url}/{asset}"}

          manifest = {
              "version": version,
              "notes": f"https://github.com/tempestai-dev/tempest/releases/tag/{tag}",
              "pub_date": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }

          print(json.dumps(manifest, indent=2))

          with open("latest.json", "w") as f:
              json.dump(manifest, f, indent=2)

          subprocess.run(
              ["gh", "release", "upload", tag, "latest.json", "--clobber",
               "--repo", "tempestai-dev/tempest"],
              check=True,
              env=os.environ,
          )
          PYEOF
